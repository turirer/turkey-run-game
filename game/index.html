<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turkey Run — Thanksgiving Breakout</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2b1a10; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #game {
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
    display: block;
    touch-action: none;
    cursor: pointer;
  }
  /* Screen-reader status line: announced, never painted. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="1280" height="720" aria-label="Turkey Run: a turkey escapes the Thanksgiving farm. Jump fences and ovens, duck flying carving knives, grab corn, and outrun the farmer to the Freedom Gate."></canvas>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
